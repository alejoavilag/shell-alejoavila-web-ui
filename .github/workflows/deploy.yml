name: Desplegar shell

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Permiso minimo. id-token es lo que habilita OIDC hacia GCP: sin el no hay
# federacion, y con el no hace falta ninguna llave de servicio.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-shell-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Construir
        run: npm run build

      - name: Verificar que no se filtraron secretos al bundle
        run: |
          if grep -rlE 'AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----' out/ 2>/dev/null; then
            echo "::error::Se encontro material sensible en el bundle publicado"
            exit 1
          fi
          echo "Sin secretos detectados en out/"

  desplegar:
    name: Desplegar a Firebase Hosting
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Federacion de identidad: GitHub presenta un token OIDC de corta vida y
      # GCP lo canjea. No existe ningun JSON de credenciales en este repositorio.
      - name: Autenticar contra GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: alejoavila-web
          workload_identity_provider: projects/1027646897233/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@alejoavila-web.iam.gserviceaccount.com

      # Se usa el CLI oficial en vez de una accion de terceros para reducir la
      # superficie de cadena de suministro.
      - name: Publicar
        run: npx --yes firebase-tools@latest deploy --only hosting --project alejoavila-web --non-interactive
